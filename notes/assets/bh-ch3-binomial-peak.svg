<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="560" height="360" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#1e3a8a" font-weight="600">Binomial coefficients C(10, k) peak in the middle</text>
  <!-- axes -->
  <line x1="60" y1="300" x2="520" y2="300" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="300" x2="60" y2="60" stroke="#374151" stroke-width="2"/>
  <!-- bars -->
  <rect x="78"  y="298" width="24" height="2"   rx="2" fill="#3b82f6"/>
  <rect x="116" y="291" width="24" height="9"   rx="2" fill="#3b82f6"/>
  <rect x="154" y="261" width="24" height="39"  rx="2" fill="#3b82f6"/>
  <rect x="192" y="195" width="24" height="105" rx="2" fill="#3b82f6"/>
  <rect x="230" y="117" width="24" height="183" rx="2" fill="#3b82f6"/>
  <rect x="268" y="80"  width="24" height="220" rx="2" fill="#f59e0b"/>
  <rect x="306" y="117" width="24" height="183" rx="2" fill="#3b82f6"/>
  <rect x="344" y="195" width="24" height="105" rx="2" fill="#3b82f6"/>
  <rect x="382" y="261" width="24" height="39"  rx="2" fill="#3b82f6"/>
  <rect x="420" y="291" width="24" height="9"   rx="2" fill="#3b82f6"/>
  <rect x="458" y="298" width="24" height="2"   rx="2" fill="#3b82f6"/>
  <!-- peak annotation -->
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#b45309" font-weight="600">252</text>
  <!-- x labels -->
  <g font-size="13" fill="#6b7280" text-anchor="middle">
    <text x="90"  y="318">0</text>
    <text x="128" y="318">1</text>
    <text x="166" y="318">2</text>
    <text x="204" y="318">3</text>
    <text x="242" y="318">4</text>
    <text x="280" y="318">5</text>
    <text x="318" y="318">6</text>
    <text x="356" y="318">7</text>
    <text x="394" y="318">8</text>
    <text x="432" y="318">9</text>
    <text x="470" y="318">10</text>
  </g>
  <text x="290" y="344" text-anchor="middle" font-size="14" fill="#374151"><tspan font-style="italic">k</tspan>  (items chosen out of 10)</text>
  <text x="30" y="180" text-anchor="middle" font-size="14" fill="#374151" transform="rotate(-90 30 180)">number of ways</text>
</svg>
