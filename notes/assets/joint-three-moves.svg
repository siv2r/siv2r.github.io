<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 292" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4a90d9"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3aa38a"/></marker>
  </defs>

  <!-- panel dividers -->
  <line x1="272" y1="58" x2="272" y2="234" stroke="#999" stroke-opacity="0.25"/>
  <line x1="557" y1="58" x2="557" y2="234" stroke="#999" stroke-opacity="0.25"/>

  <!-- ===================== PANEL 1: MARGINAL ===================== -->
  <g>
    <text x="120" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#4a90d9">Marginal PMF</text>
    <text x="120" y="44" text-anchor="middle" font-size="11" fill="#999">sum a row</text>

    <!-- highlighted top row -->
    <rect x="64" y="78" width="80" height="40" fill="#4a90d9" fill-opacity="0.18"/>
    <!-- grid -->
    <rect x="64" y="78" width="80" height="80" fill="none" stroke="#888"/>
    <line x1="104" y1="78" x2="104" y2="158" stroke="#888"/>
    <line x1="64" y1="118" x2="144" y2="118" stroke="#888"/>
    <!-- headers -->
    <text x="84" y="71" text-anchor="middle" font-size="11" fill="#999">Y=1</text>
    <text x="124" y="71" text-anchor="middle" font-size="11" fill="#999">Y=0</text>
    <text x="58" y="103" text-anchor="end" font-size="11" fill="#999">X=1</text>
    <text x="58" y="143" text-anchor="end" font-size="11" fill="#999">X=0</text>
    <!-- cells -->
    <text x="84" y="103" text-anchor="middle" font-size="13" fill="#888">5</text>
    <text x="124" y="103" text-anchor="middle" font-size="13" fill="#888">20</text>
    <text x="84" y="143" text-anchor="middle" font-size="13" fill="#888">3</text>
    <text x="124" y="143" text-anchor="middle" font-size="13" fill="#888">72</text>
    <!-- arrow to marginal -->
    <line x1="146" y1="98" x2="172" y2="98" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrB)"/>
    <text x="188" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#4a90d9">25</text>
    <text x="188" y="118" text-anchor="middle" font-size="10" fill="#999">P(X=1)</text>
    <!-- caption -->
    <text x="120" y="250" text-anchor="middle" font-size="12" fill="#888">row sum = P(X=1) = 25/100</text>
  </g>

  <!-- ===================== PANEL 2: CONDITIONAL ===================== -->
  <g transform="translate(285,0)">
    <text x="120" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#3aa38a">Conditional PMF</text>
    <text x="120" y="44" text-anchor="middle" font-size="11" fill="#999">rescale a row</text>

    <rect x="64" y="78" width="80" height="40" fill="#3aa38a" fill-opacity="0.16"/>
    <rect x="64" y="78" width="80" height="80" fill="none" stroke="#888"/>
    <line x1="104" y1="78" x2="104" y2="158" stroke="#888"/>
    <line x1="64" y1="118" x2="144" y2="118" stroke="#888"/>
    <text x="84" y="71" text-anchor="middle" font-size="11" fill="#999">Y=1</text>
    <text x="124" y="71" text-anchor="middle" font-size="11" fill="#999">Y=0</text>
    <text x="58" y="103" text-anchor="end" font-size="11" fill="#999">X=1</text>
    <text x="58" y="143" text-anchor="end" font-size="11" fill="#999">X=0</text>
    <text x="84" y="103" text-anchor="middle" font-size="13" fill="#888">5</text>
    <text x="124" y="103" text-anchor="middle" font-size="13" fill="#888">20</text>
    <text x="84" y="143" text-anchor="middle" font-size="13" fill="#888">3</text>
    <text x="124" y="143" text-anchor="middle" font-size="13" fill="#888">72</text>
    <!-- divide arrow down -->
    <line x1="104" y1="160" x2="104" y2="182" stroke="#3aa38a" stroke-width="1.5" marker-end="url(#arrG)"/>
    <text x="118" y="176" text-anchor="start" font-size="12" fill="#3aa38a">÷ 25</text>
    <!-- renormalized row -->
    <rect x="64" y="186" width="80" height="34" fill="#3aa38a" fill-opacity="0.10" stroke="#888"/>
    <line x1="104" y1="186" x2="104" y2="220" stroke="#888"/>
    <text x="84" y="208" text-anchor="middle" font-size="13" fill="#888">1/5</text>
    <text x="124" y="208" text-anchor="middle" font-size="13" fill="#888">4/5</text>
    <text x="176" y="208" text-anchor="start" font-size="11" fill="#3aa38a">sum 1</text>
    <text x="120" y="250" text-anchor="middle" font-size="12" fill="#888">P(Y | X=1), a valid PMF</text>
  </g>

  <!-- ===================== PANEL 3: INDEPENDENCE ===================== -->
  <g transform="translate(570,0)">
    <text x="120" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#d9822b">Independence</text>
    <text x="120" y="44" text-anchor="middle" font-size="11" fill="#999">cell = row × column?</text>

    <!-- highlighted single cell -->
    <rect x="64" y="78" width="40" height="40" fill="#d9822b" fill-opacity="0.22"/>
    <rect x="64" y="78" width="80" height="80" fill="none" stroke="#888"/>
    <line x1="104" y1="78" x2="104" y2="158" stroke="#888"/>
    <line x1="64" y1="118" x2="144" y2="118" stroke="#888"/>
    <text x="84" y="71" text-anchor="middle" font-size="11" fill="#999">Y=1</text>
    <text x="124" y="71" text-anchor="middle" font-size="11" fill="#999">Y=0</text>
    <text x="58" y="103" text-anchor="end" font-size="11" fill="#999">X=1</text>
    <text x="58" y="143" text-anchor="end" font-size="11" fill="#999">X=0</text>
    <text x="84" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#d9822b">5</text>
    <text x="124" y="103" text-anchor="middle" font-size="13" fill="#888">20</text>
    <text x="84" y="143" text-anchor="middle" font-size="13" fill="#888">3</text>
    <text x="124" y="143" text-anchor="middle" font-size="13" fill="#888">72</text>
    <!-- margins -->
    <text x="152" y="102" text-anchor="start" font-size="10" fill="#999">row 25</text>
    <text x="84" y="176" text-anchor="middle" font-size="10" fill="#999">col 8</text>
    <!-- comparison -->
    <text x="120" y="208" text-anchor="middle" font-size="13" fill="#888"><tspan fill="#d9822b" font-weight="700">5</tspan>/100  ≠  <tspan font-weight="700">2</tspan>/100</text>
    <text x="120" y="250" text-anchor="middle" font-size="12" fill="#888">cell ≠ row × col → dependent</text>
  </g>

  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#999">Smoker and lung-cancer table, all entries ÷ 100.</text>
</svg>
