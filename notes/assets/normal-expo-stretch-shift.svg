<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="410" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2430">Every Normal is one bell: stretch by σ, then slide to μ</text>
  <text x="380" y="44" text-anchor="middle" font-size="12" fill="#666666">the same mass block tracked through both moves</text>

  <!-- row 1: standard normal -->
  <line x1="60" y1="140" x2="500" y2="140" stroke="#555555" stroke-width="1.5"/>
  <path d="M 135 139.8 L 142.5 139.6 L 150 139.1 L 157.5 138.2 L 165 136.5 L 172.5 133.7 L 180 129.2 L 187.5 122.7 L 195 114.1 L 202.5 103.5 L 210 91.6 L 217.5 79.8 L 225 69.6 L 232.5 62.7 L 240 60.2 L 247.5 62.7 L 255 69.6 L 262.5 79.8 L 270 91.6 L 277.5 103.5 L 285 114.1 L 292.5 122.7 L 300 129.2 L 307.5 133.7 L 315 136.5 L 322.5 138.2 L 330 139.1 L 337.5 139.6 L 345 139.8" fill="none" stroke="#3b78c2" stroke-width="2"/>
  <rect x="270" y="92" width="9" height="48" fill="#3b78c2" fill-opacity="0.18" stroke="#3b78c2" stroke-width="1.2"/>
  <line x1="240" y1="140" x2="240" y2="145" stroke="#555555" stroke-width="1.2"/>
  <text x="240" y="158" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="520" y="100" font-size="13" font-weight="bold" fill="#3b78c2">Z ~ N(0, 1)</text>
  <text x="520" y="118" font-size="12" fill="#1f2430">one bell, peak height 0.40</text>

  <!-- transport guides row 1 to row 2 -->
  <line x1="270" y1="141" x2="300" y2="225" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="279" y1="141" x2="318" y2="225" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- row 2: stretched by sigma = 2 -->
  <line x1="30" y1="250" x2="500" y2="250" stroke="#555555" stroke-width="1.5"/>
  <path d="M 30 249.9 L 45 249.8 L 60 249.6 L 75 249.1 L 90 248.2 L 105 246.8 L 120 244.6 L 135 241.4 L 150 237.0 L 165 231.7 L 180 225.8 L 195 219.9 L 210 214.8 L 225 211.3 L 240 210.1 L 255 211.3 L 270 214.8 L 285 219.9 L 300 225.8 L 315 231.7 L 330 237.0 L 345 241.4 L 360 244.6 L 375 246.8 L 390 248.2 L 405 249.1 L 420 249.6 L 435 249.8 L 450 249.9" fill="none" stroke="#c96a2a" stroke-width="2"/>
  <rect x="300" y="226" width="18" height="24" fill="#c96a2a" fill-opacity="0.18" stroke="#c96a2a" stroke-width="1.2"/>
  <line x1="240" y1="250" x2="240" y2="255" stroke="#555555" stroke-width="1.2"/>
  <text x="240" y="267" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="309" y="267" text-anchor="middle" font-size="12" fill="#c96a2a">2</text>
  <text x="520" y="205" font-size="13" font-weight="bold" fill="#c96a2a">stretch by σ = 2</text>
  <text x="520" y="223" font-size="12" fill="#1f2430">widths ×2, heights ÷2</text>
  <text x="520" y="241" font-size="12" fill="#1f2430">f(w) = φ(w/2) / 2</text>

  <!-- transport guides row 2 to row 3 -->
  <line x1="300" y1="251" x2="390" y2="335" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="318" y1="251" x2="408" y2="335" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- row 3: slid to mu = 3 -->
  <line x1="30" y1="360" x2="560" y2="360" stroke="#555555" stroke-width="1.5"/>
  <path d="M 120 359.9 L 135 359.8 L 150 359.6 L 165 359.1 L 180 358.2 L 195 356.8 L 210 354.6 L 225 351.4 L 240 347.0 L 255 341.7 L 270 335.8 L 285 329.9 L 300 324.8 L 315 321.3 L 330 320.1 L 345 321.3 L 360 324.8 L 375 329.9 L 390 335.8 L 405 341.7 L 420 347.0 L 435 351.4 L 450 354.6 L 465 356.8 L 480 358.2 L 495 359.1 L 510 359.6 L 525 359.8 L 540 359.9" fill="none" stroke="#c96a2a" stroke-width="2"/>
  <rect x="390" y="336" width="18" height="24" fill="#c96a2a" fill-opacity="0.18" stroke="#c96a2a" stroke-width="1.2"/>
  <line x1="240" y1="360" x2="240" y2="365" stroke="#555555" stroke-width="1.2"/>
  <text x="240" y="377" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <line x1="330" y1="360" x2="330" y2="365" stroke="#555555" stroke-width="1.2"/>
  <text x="330" y="377" text-anchor="middle" font-size="12" fill="#555555">3 = μ</text>
  <text x="399" y="377" text-anchor="middle" font-size="12" fill="#c96a2a">5</text>
  <text x="575" y="315" font-size="13" font-weight="bold" fill="#c96a2a">slide to μ = 3</text>
  <text x="575" y="333" font-size="12" fill="#1f2430">heights untouched</text>
  <text x="575" y="351" font-size="12" fill="#1f2430">f(x) = φ((x−3)/2) / 2</text>
</svg>
