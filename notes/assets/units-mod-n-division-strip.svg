<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" font-family="Helvetica, Arial, sans-serif">
  <!-- panel so the figure reads on dark and light Obsidian themes -->
  <rect x="0" y="0" width="720" height="236" rx="8" fill="#ffffff" stroke="#d4d4d8"/>

  <!-- title -->
  <text x="36" y="30" font-size="15" fill="#1f2937">
    <tspan font-weight="bold">a = q·b + r</tspan>
    <tspan dx="14" fill="#4b5563">36 = 2·15 + 6, with d = gcd(36, 15) = 3</tspan>
  </text>

  <!-- segment labels above the strip (scale: 18 px per unit, origin x = 36) -->
  <text x="171" y="62" font-size="14" text-anchor="middle" fill="#1e40af">b = 15</text>
  <text x="441" y="62" font-size="14" text-anchor="middle" fill="#1e40af">b = 15</text>
  <text x="630" y="62" font-size="14" text-anchor="middle" fill="#b45309">r = 6</text>

  <!-- the strip of length a, cut into q = 2 segments of b and a leftover r -->
  <rect x="36"  y="70" width="270" height="36" fill="#dbeafe" stroke="#1e40af"/>
  <rect x="306" y="70" width="270" height="36" fill="#dbeafe" stroke="#1e40af"/>
  <rect x="576" y="70" width="108" height="36" fill="#fde68a" stroke="#b45309"/>

  <!-- bracket-ish label for the whole strip -->
  <line x1="36" y1="116" x2="684" y2="116" stroke="#6b7280" stroke-width="1"/>
  <line x1="36" y1="111" x2="36" y2="121" stroke="#6b7280" stroke-width="1"/>
  <line x1="684" y1="111" x2="684" y2="121" stroke="#6b7280" stroke-width="1"/>
  <text x="360" y="133" font-size="13" text-anchor="middle" fill="#4b5563">a = 36</text>

  <!-- the d-block ruler: 12 blocks of 3 units = 54 px each -->
  <g stroke="#374151" stroke-width="1">
    <rect x="36"  y="150" width="54" height="22" fill="#e5e7eb"/>
    <rect x="90"  y="150" width="54" height="22" fill="#f3f4f6"/>
    <rect x="144" y="150" width="54" height="22" fill="#e5e7eb"/>
    <rect x="198" y="150" width="54" height="22" fill="#f3f4f6"/>
    <rect x="252" y="150" width="54" height="22" fill="#e5e7eb"/>
    <rect x="306" y="150" width="54" height="22" fill="#f3f4f6"/>
    <rect x="360" y="150" width="54" height="22" fill="#e5e7eb"/>
    <rect x="414" y="150" width="54" height="22" fill="#f3f4f6"/>
    <rect x="468" y="150" width="54" height="22" fill="#e5e7eb"/>
    <rect x="522" y="150" width="54" height="22" fill="#f3f4f6"/>
    <rect x="576" y="150" width="54" height="22" fill="#fef3c7"/>
    <rect x="630" y="150" width="54" height="22" fill="#fde68a"/>
  </g>

  <!-- guide lines showing the segment cuts land on block boundaries -->
  <line x1="306" y1="106" x2="306" y2="150" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <line x1="576" y1="106" x2="576" y2="150" stroke="#9ca3af" stroke-dasharray="3 3"/>

  <!-- block counts under each segment -->
  <text x="171" y="194" font-size="13" text-anchor="middle" fill="#4b5563">5 blocks</text>
  <text x="441" y="194" font-size="13" text-anchor="middle" fill="#4b5563">5 blocks</text>
  <text x="630" y="194" font-size="13" text-anchor="middle" fill="#b45309">2 blocks</text>

  <!-- caption -->
  <text x="36" y="222" font-size="13" fill="#374151">d tiles a and tiles each b segment, so it tiles the leftover: r = a − q·b = (k₁ − q·k₂)·d. Every cut lands on a block edge.</text>
</svg>
