<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2430">e<tspan dy="-6" font-size="11">−λx</tspan><tspan dy="6"> is an unbroken streak of nothing happening</tspan></text>

  <!-- sliced timeline -->
  <text x="230" y="52" text-anchor="middle" font-size="12" fill="#1f2430">one slice: width x/n</text>
  <text x="230" y="68" text-anchor="middle" font-size="12" fill="#1f2430">P(no event) = 1 − λx/n</text>
  <line x1="230" y1="74" x2="230" y2="93" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="80" y="95" width="60" height="30" fill="#3b78c2" fill-opacity="0.08" stroke="#3b78c2" stroke-width="0.8"/>
  <rect x="140" y="95" width="60" height="30" fill="#3b78c2" fill-opacity="0.16" stroke="#3b78c2" stroke-width="0.8"/>
  <rect x="200" y="95" width="60" height="30" fill="#3b78c2" fill-opacity="0.08" stroke="#3b78c2" stroke-width="0.8"/>
  <rect x="260" y="95" width="60" height="30" fill="#3b78c2" fill-opacity="0.16" stroke="#3b78c2" stroke-width="0.8"/>
  <rect x="320" y="95" width="60" height="30" fill="#3b78c2" fill-opacity="0.08" stroke="#3b78c2" stroke-width="0.8"/>
  <rect x="380" y="95" width="60" height="30" fill="#3b78c2" fill-opacity="0.16" stroke="#3b78c2" stroke-width="0.8"/>
  <rect x="440" y="95" width="60" height="30" fill="#3b78c2" fill-opacity="0.08" stroke="#3b78c2" stroke-width="0.8"/>
  <rect x="500" y="95" width="60" height="30" fill="#3b78c2" fill-opacity="0.16" stroke="#3b78c2" stroke-width="0.8"/>
  <line x1="80" y1="125" x2="560" y2="125" stroke="#555555" stroke-width="1.5"/>
  <text x="80" y="143" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="560" y="143" text-anchor="middle" font-size="12" fill="#555555">x</text>
  <text x="580" y="105" font-size="13" fill="#1f2430">all n slices miss:</text>
  <text x="580" y="124" font-size="13" fill="#1f2430">(1 − λx/n)<tspan dy="-6" font-size="10">n</tspan></text>

  <!-- limit arrow -->
  <line x1="320" y1="152" x2="320" y2="188" stroke="#666666" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <text x="334" y="174" font-size="13" fill="#666666">n → ∞</text>

  <!-- survival curve -->
  <line x1="80" y1="380" x2="680" y2="380" stroke="#555555" stroke-width="1.5"/>
  <line x1="80" y1="380" x2="80" y2="215" stroke="#555555" stroke-width="1.5"/>
  <line x1="76" y1="230" x2="84" y2="230" stroke="#555555" stroke-width="1.2"/>
  <text x="68" y="234" text-anchor="end" font-size="12" fill="#555555">1</text>
  <path d="M 80 230 L 120 242 L 160 253 L 200 263.2 L 240 272.5 L 280 281.1 L 320 289 L 360 296.3 L 400 303 L 440 309.1 L 480 314.8 L 520 320 L 560 324.8 L 600 329.2 L 640 333.3 L 680 337" fill="none" stroke="#3b78c2" stroke-width="2"/>
  <text x="220" y="247" font-size="13" fill="#3b78c2">P(X &gt; t) = e<tspan dy="-6" font-size="10">−λt</tspan></text>

  <!-- the point x and the trigger sliver -->
  <line x1="560" y1="380" x2="560" y2="326" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="560" cy="324.8" r="3.5" fill="#3b78c2"/>
  <text x="548" y="300" text-anchor="end" font-size="12" fill="#3b78c2">survived to x: e<tspan dy="-5" font-size="10">−λx</tspan></text>
  <rect x="560" y="374" width="14" height="6" fill="#c96a2a"/>
  <text x="556" y="398" text-anchor="end" font-size="12" fill="#555555">x</text>
  <text x="572" y="398" font-size="12" fill="#c96a2a">dx</text>
  <text x="598" y="296" font-size="12" fill="#c96a2a">then trigger in the sliver:</text>
  <text x="598" y="314" font-size="12" fill="#c96a2a">λ · dx</text>
  <line x1="610" y1="320" x2="569" y2="371" stroke="#c96a2a" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="380" y="420" text-anchor="middle" font-size="13" fill="#1f2430">f(x) dx = e<tspan dy="-6" font-size="10">−λx</tspan><tspan dy="6"> · λ dx, survive all the way to x, then trigger in the next dx</tspan></text>
</svg>
