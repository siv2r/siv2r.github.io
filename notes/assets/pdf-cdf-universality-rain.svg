<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2430">X = F⁻¹(U): uniform rain lands as the target distribution</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b78c2"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="80" y1="470" x2="700" y2="470" stroke="#555555" stroke-width="1.5"/>
  <line x1="80" y1="470" x2="80" y2="70" stroke="#555555" stroke-width="1.5"/>
  <text x="706" y="474" font-size="13" fill="#555555">x (value)</text>
  <text x="80" y="58" text-anchor="middle" font-size="13" fill="#555555">u (percentile)</text>

  <!-- curve F(x) = sqrt(x) -->
  <path d="M80,470 L81.5,451 L86,432 L93.5,413 L104,394 L117.5,375 L134,356 L153.5,337 L176,318 L201.5,299 L230,280 L261.5,261 L296,242 L333.5,223 L374,204 L417.5,185 L464,166 L513.5,147 L566,128 L621.5,109 L680,90" fill="none" stroke="#1f2430" stroke-width="2"/>
  <text x="590" y="162" font-size="14" font-style="italic" fill="#1f2430">F(x) = √x</text>

  <!-- highlighted path at u = 0.9, with direction arrows -->
  <line x1="80" y1="128" x2="556" y2="128" stroke="#3b78c2" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="566" y1="138" x2="566" y2="458" stroke="#3b78c2" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="300" y="118" font-size="12" fill="#3b78c2">slide to the curve</text>
  <text x="576" y="300" font-size="12" fill="#3b78c2">drop to x = F⁻¹(u)</text>

  <!-- rain paths u = 0.1 .. 0.8, dashed -->
  <line x1="80" y1="432" x2="86" y2="432" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="86" y1="432" x2="86" y2="470" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="80" y1="394" x2="104" y2="394" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="104" y1="394" x2="104" y2="470" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="80" y1="356" x2="134" y2="356" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="134" y1="356" x2="134" y2="470" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="80" y1="318" x2="176" y2="318" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="176" y1="318" x2="176" y2="470" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="80" y1="280" x2="230" y2="280" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="230" y1="280" x2="230" y2="470" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="80" y1="242" x2="296" y2="242" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="296" y1="242" x2="296" y2="470" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="80" y1="204" x2="374" y2="204" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="374" y1="204" x2="374" y2="470" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="80" y1="166" x2="464" y2="166" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="464" y1="166" x2="464" y2="470" stroke="#9bb8dc" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- droplets on the percentile axis -->
  <circle cx="68" cy="432" r="5" fill="#3b78c2"/>
  <circle cx="68" cy="394" r="5" fill="#3b78c2"/>
  <circle cx="68" cy="356" r="5" fill="#3b78c2"/>
  <circle cx="68" cy="318" r="5" fill="#3b78c2"/>
  <circle cx="68" cy="280" r="5" fill="#3b78c2"/>
  <circle cx="68" cy="242" r="5" fill="#3b78c2"/>
  <circle cx="68" cy="204" r="5" fill="#3b78c2"/>
  <circle cx="68" cy="166" r="5" fill="#3b78c2"/>
  <circle cx="68" cy="128" r="5" fill="#3b78c2"/>
  <text x="40" y="280" transform="rotate(-90 40 280)" text-anchor="middle" font-size="13" fill="#3b78c2">evenly spaced U draws</text>

  <!-- landings on the value axis -->
  <circle cx="86" cy="470" r="5" fill="#c96a2a"/>
  <circle cx="104" cy="470" r="5" fill="#c96a2a"/>
  <circle cx="134" cy="470" r="5" fill="#c96a2a"/>
  <circle cx="176" cy="470" r="5" fill="#c96a2a"/>
  <circle cx="230" cy="470" r="5" fill="#c96a2a"/>
  <circle cx="296" cy="470" r="5" fill="#c96a2a"/>
  <circle cx="374" cy="470" r="5" fill="#c96a2a"/>
  <circle cx="464" cy="470" r="5" fill="#c96a2a"/>
  <circle cx="566" cy="470" r="5" fill="#c96a2a"/>
  <text x="200" y="502" text-anchor="middle" font-size="13" fill="#c96a2a">landings pile up where F is steep</text>

  <text x="380" y="540" text-anchor="middle" font-size="13" fill="#1f2430">Read the paths backwards (x up to the curve, across to u) and any X flattens back to uniform: F(X) ~ Unif(0,1)</text>
</svg>
