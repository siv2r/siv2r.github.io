<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Helvetica, Arial, sans-serif">
  <!-- panel so the figure reads on dark and light Obsidian themes -->
  <rect x="0" y="0" width="720" height="300" rx="8" fill="#ffffff" stroke="#d4d4d8"/>

  <!-- title -->
  <text x="36" y="30" font-size="15" fill="#1f2937">
    <tspan font-weight="bold">24 = 1·18 + 6</tspan>
    <tspan dx="14" fill="#4b5563">two blocks that both pass the tiling argument</tspan>
  </text>

  <!-- scale: 24 px per unit, origin x = 36, strip ends at 612 -->

  <!-- ROW A: block 3 -->
  <text x="252" y="58" font-size="13" text-anchor="middle" fill="#1e40af">b = 18</text>
  <text x="540" y="58" font-size="13" text-anchor="middle" fill="#b45309">r = 6</text>
  <rect x="36"  y="64" width="432" height="28" fill="#dbeafe" stroke="#1e40af"/>
  <rect x="468" y="64" width="144" height="28" fill="#fde68a" stroke="#b45309"/>
  <g stroke="#374151" stroke-width="1">
    <rect x="36"  y="98" width="72" height="18" fill="#e5e7eb"/>
    <rect x="108" y="98" width="72" height="18" fill="#f3f4f6"/>
    <rect x="180" y="98" width="72" height="18" fill="#e5e7eb"/>
    <rect x="252" y="98" width="72" height="18" fill="#f3f4f6"/>
    <rect x="324" y="98" width="72" height="18" fill="#e5e7eb"/>
    <rect x="396" y="98" width="72" height="18" fill="#f3f4f6"/>
    <rect x="468" y="98" width="72" height="18" fill="#fef3c7"/>
    <rect x="540" y="98" width="72" height="18" fill="#fde68a"/>
  </g>
  <line x1="468" y1="92" x2="468" y2="98" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <text x="628" y="112" font-size="13" fill="#374151">block 3</text>
  <text x="36" y="138" font-size="13" fill="#374151">3 tiles 24, tiles 18, so tiles 6. A common divisor of (18, 6). Not the greatest.</text>

  <!-- ROW B: block 6 -->
  <text x="252" y="182" font-size="13" text-anchor="middle" fill="#1e40af">b = 18</text>
  <text x="540" y="182" font-size="13" text-anchor="middle" fill="#b45309">r = 6</text>
  <rect x="36"  y="188" width="432" height="28" fill="#dbeafe" stroke="#1e40af"/>
  <rect x="468" y="188" width="144" height="28" fill="#fde68a" stroke="#b45309"/>
  <g stroke="#374151" stroke-width="1">
    <rect x="36"  y="222" width="144" height="18" fill="#e5e7eb"/>
    <rect x="180" y="222" width="144" height="18" fill="#f3f4f6"/>
    <rect x="324" y="222" width="144" height="18" fill="#e5e7eb"/>
    <rect x="468" y="222" width="144" height="18" fill="#fde68a"/>
  </g>
  <line x1="468" y1="216" x2="468" y2="222" stroke="#9ca3af" stroke-dasharray="3 3"/>
  <text x="628" y="236" font-size="13" fill="#374151">block 6</text>
  <text x="36" y="262" font-size="13" fill="#374151">6 tiles all three as well. gcd(18, 6) = 6.</text>

  <!-- caption -->
  <text x="36" y="288" font-size="13" fill="#1f2937" font-weight="bold">The tiling argument cannot tell 3 from 6. It proves "divides both", never "greatest".</text>
</svg>
