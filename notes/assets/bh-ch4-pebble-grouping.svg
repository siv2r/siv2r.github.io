<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="system-ui, -apple-system, sans-serif">
  <!-- title -->
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#8a8f98">One sum, two groupings</text>
  <text x="390" y="52" text-anchor="middle" font-size="13" fill="#8a8f98">E(X) computed on the two-coin pebble world, X = first coin</text>

  <!-- X value labels above pebbles -->
  <text x="120" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#4a7fb5">X = 1</text>
  <text x="300" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#4a7fb5">X = 1</text>
  <text x="480" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#c77f3a">X = 0</text>
  <text x="660" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#c77f3a">X = 0</text>

  <!-- pebbles -->
  <circle cx="120" cy="125" r="28" fill="#4a7fb5" fill-opacity="0.16" stroke="#4a7fb5" stroke-width="2"/>
  <circle cx="300" cy="125" r="28" fill="#4a7fb5" fill-opacity="0.16" stroke="#4a7fb5" stroke-width="2"/>
  <circle cx="480" cy="125" r="28" fill="#c77f3a" fill-opacity="0.16" stroke="#c77f3a" stroke-width="2"/>
  <circle cx="660" cy="125" r="28" fill="#c77f3a" fill-opacity="0.16" stroke="#c77f3a" stroke-width="2"/>
  <text x="120" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#8a8f98">HH</text>
  <text x="300" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#8a8f98">HT</text>
  <text x="480" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#8a8f98">TH</text>
  <text x="660" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#8a8f98">TT</text>

  <!-- per-pebble weight -->
  <text x="120" y="172" text-anchor="middle" font-size="12" fill="#8a8f98">P = 1/4</text>
  <text x="300" y="172" text-anchor="middle" font-size="12" fill="#8a8f98">P = 1/4</text>
  <text x="480" y="172" text-anchor="middle" font-size="12" fill="#8a8f98">P = 1/4</text>
  <text x="660" y="172" text-anchor="middle" font-size="12" fill="#8a8f98">P = 1/4</text>

  <!-- ungrouped sum row -->
  <text x="390" y="205" text-anchor="middle" font-size="14" fill="#8a8f98">ungrouped:&#160;&#160; 1&#183;&#188; &#160;+&#160; 1&#183;&#188; &#160;+&#160; 0&#183;&#188; &#160;+&#160; 0&#183;&#188;</text>

  <!-- grouping arrows -->
  <path d="M 130 225 Q 160 255 195 272" fill="none" stroke="#4a7fb5" stroke-width="1.8" marker-end="url(#ab)"/>
  <path d="M 292 225 Q 265 255 235 272" fill="none" stroke="#4a7fb5" stroke-width="1.8" marker-end="url(#ab)"/>
  <path d="M 490 225 Q 520 255 555 272" fill="none" stroke="#c77f3a" stroke-width="1.8" marker-end="url(#ao)"/>
  <path d="M 652 225 Q 625 255 595 272" fill="none" stroke="#c77f3a" stroke-width="1.8" marker-end="url(#ao)"/>
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7fb5"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c77f3a"/></marker>
  </defs>

  <!-- super-pebbles -->
  <ellipse cx="215" cy="315" rx="115" ry="38" fill="#4a7fb5" fill-opacity="0.12" stroke="#4a7fb5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="215" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#4a7fb5">super-pebble: X = 1</text>
  <text x="215" y="330" text-anchor="middle" font-size="12.5" fill="#8a8f98">weight 1/4 + 1/4 = 1/2 = P(X=1)</text>

  <ellipse cx="575" cy="315" rx="115" ry="38" fill="#c77f3a" fill-opacity="0.12" stroke="#c77f3a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="575" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#c77f3a">super-pebble: X = 0</text>
  <text x="575" y="330" text-anchor="middle" font-size="12.5" fill="#8a8f98">weight 1/4 + 1/4 = 1/2 = P(X=0)</text>

  <!-- grouped equation -->
  <text x="390" y="398" text-anchor="middle" font-size="15" fill="#8a8f98">
    <tspan>&#931;</tspan><tspan font-size="11" dy="3">s</tspan><tspan dy="-3">&#160;X(s)&#183;P({s}) &#160;=&#160; </tspan><tspan fill="#4a7fb5">1&#183;P(X=1)</tspan><tspan> + </tspan><tspan fill="#c77f3a">0&#183;P(X=0)</tspan><tspan> &#160;=&#160; E(X)</tspan>
  </text>

  <!-- footnote -->
  <text x="390" y="432" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a8f98">Within a super-pebble, X is constant. Its weight is P(X=x) by definition.</text>
  <text x="390" y="452" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a8f98">The regrouping never asks whether X and Y are independent.</text>
</svg>
