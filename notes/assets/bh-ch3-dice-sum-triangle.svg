<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="560" height="360" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#1e3a8a" font-weight="600">Sum of two dice: mass piles up in the middle</text>
  <!-- axes -->
  <line x1="60" y1="300" x2="520" y2="300" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="300" x2="60" y2="60" stroke="#374151" stroke-width="2"/>
  <!-- triangle guide through the tops -->
  <polyline points="90,263 128,227 166,190 204,153 242,117 280,80 318,117 356,153 394,190 432,227 470,263"
            fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- lollipop stems -->
  <g stroke="#3b82f6" stroke-width="2.5">
    <line x1="90"  y1="300" x2="90"  y2="263"/>
    <line x1="128" y1="300" x2="128" y2="227"/>
    <line x1="166" y1="300" x2="166" y2="190"/>
    <line x1="204" y1="300" x2="204" y2="153"/>
    <line x1="242" y1="300" x2="242" y2="117"/>
    <line x1="280" y1="300" x2="280" y2="80"/>
    <line x1="318" y1="300" x2="318" y2="117"/>
    <line x1="356" y1="300" x2="356" y2="153"/>
    <line x1="394" y1="300" x2="394" y2="190"/>
    <line x1="432" y1="300" x2="432" y2="227"/>
    <line x1="470" y1="300" x2="470" y2="263"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="90"  cy="263" r="6"/>
    <circle cx="128" cy="227" r="6"/>
    <circle cx="166" cy="190" r="6"/>
    <circle cx="204" cy="153" r="6"/>
    <circle cx="242" cy="117" r="6"/>
    <circle cx="318" cy="117" r="6"/>
    <circle cx="356" cy="153" r="6"/>
    <circle cx="394" cy="190" r="6"/>
    <circle cx="432" cy="227" r="6"/>
    <circle cx="470" cy="263" r="6"/>
  </g>
  <circle cx="280" cy="80" r="7" fill="#f59e0b"/>
  <!-- y guide labels -->
  <g font-size="12" fill="#6b7280" text-anchor="end">
    <text x="52" y="84">6/36</text>
    <text x="52" y="267">1/36</text>
  </g>
  <!-- x labels -->
  <g font-size="13" fill="#6b7280" text-anchor="middle">
    <text x="90"  y="320">2</text>
    <text x="128" y="320">3</text>
    <text x="166" y="320">4</text>
    <text x="204" y="320">5</text>
    <text x="242" y="320">6</text>
    <text x="280" y="320">7</text>
    <text x="318" y="320">8</text>
    <text x="356" y="320">9</text>
    <text x="394" y="320">10</text>
    <text x="432" y="320">11</text>
    <text x="470" y="320">12</text>
  </g>
  <text x="290" y="345" text-anchor="middle" font-size="14" fill="#374151">sum of two dice</text>
</svg>
