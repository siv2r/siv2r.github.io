<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" fill="#1e3a8a" font-weight="600">Random walk after n steps:  P(Y = y) = C(n, (n+y)/2) &#247; 2&#8319;</text>

  <!-- ============ top row: n = 1, 2, 3 (shared vertical scale) ============ -->
  <g font-size="14" fill="#374151" text-anchor="middle" font-weight="600">
    <text x="130" y="54">n = 1</text>
    <text x="360" y="54">n = 2</text>
    <text x="590" y="54">n = 3</text>
  </g>
  <!-- baselines -->
  <line x1="46"  y1="210" x2="214" y2="210" stroke="#374151" stroke-width="2"/>
  <line x1="276" y1="210" x2="444" y2="210" stroke="#374151" stroke-width="2"/>
  <line x1="506" y1="210" x2="674" y2="210" stroke="#374151" stroke-width="2"/>

  <!-- n = 1 -->
  <g stroke="#3b82f6" stroke-width="2.5">
    <line x1="106" y1="210" x2="106" y2="80"/>
    <line x1="154" y1="210" x2="154" y2="80"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="106" cy="80" r="5"/>
    <circle cx="154" cy="80" r="5"/>
  </g>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="106" y="228">-1</text>
    <text x="154" y="228">+1</text>
  </g>

  <!-- n = 2 -->
  <g stroke="#3b82f6" stroke-width="2.5">
    <line x1="312" y1="210" x2="312" y2="145"/>
    <line x1="360" y1="210" x2="360" y2="80"/>
    <line x1="408" y1="210" x2="408" y2="145"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="312" cy="145" r="5"/>
    <circle cx="408" cy="145" r="5"/>
  </g>
  <circle cx="360" cy="80" r="5" fill="#f59e0b"/>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="312" y="228">-2</text>
    <text x="360" y="228">0</text>
    <text x="408" y="228">+2</text>
  </g>

  <!-- n = 3 -->
  <g stroke="#3b82f6" stroke-width="2.5">
    <line x1="518" y1="210" x2="518" y2="177"/>
    <line x1="566" y1="210" x2="566" y2="112"/>
    <line x1="614" y1="210" x2="614" y2="112"/>
    <line x1="662" y1="210" x2="662" y2="177"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="518" cy="177" r="5"/>
    <circle cx="566" cy="112" r="5"/>
    <circle cx="614" cy="112" r="5"/>
    <circle cx="662" cy="177" r="5"/>
  </g>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="518" y="228">-3</text>
    <text x="566" y="228">-1</text>
    <text x="614" y="228">+1</text>
    <text x="662" y="228">+3</text>
  </g>

  <!-- ============ bottom: n = 10 bell ============ -->
  <text x="360" y="262" text-anchor="middle" font-size="14" fill="#374151" font-weight="600">n = 10:  the same shape, now a bell</text>
  <line x1="200" y1="440" x2="520" y2="440" stroke="#374151" stroke-width="2"/>
  <g stroke="#3b82f6" stroke-width="2.5">
    <line x1="210" y1="440" x2="210" y2="438"/>
    <line x1="240" y1="440" x2="240" y2="434"/>
    <line x1="270" y1="440" x2="270" y2="413"/>
    <line x1="300" y1="440" x2="300" y2="368"/>
    <line x1="330" y1="440" x2="330" y2="315"/>
    <line x1="360" y1="440" x2="360" y2="290"/>
    <line x1="390" y1="440" x2="390" y2="315"/>
    <line x1="420" y1="440" x2="420" y2="368"/>
    <line x1="450" y1="440" x2="450" y2="413"/>
    <line x1="480" y1="440" x2="480" y2="434"/>
    <line x1="510" y1="440" x2="510" y2="438"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="210" cy="438" r="4"/>
    <circle cx="240" cy="434" r="4"/>
    <circle cx="270" cy="413" r="4"/>
    <circle cx="300" cy="368" r="4"/>
    <circle cx="330" cy="315" r="4"/>
    <circle cx="390" cy="315" r="4"/>
    <circle cx="420" cy="368" r="4"/>
    <circle cx="450" cy="413" r="4"/>
    <circle cx="480" cy="434" r="4"/>
    <circle cx="510" cy="438" r="4"/>
  </g>
  <circle cx="360" cy="290" r="5" fill="#f59e0b"/>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="210" y="456">-10</text>
    <text x="240" y="456">-8</text>
    <text x="270" y="456">-6</text>
    <text x="300" y="456">-4</text>
    <text x="330" y="456">-2</text>
    <text x="360" y="456">0</text>
    <text x="390" y="456">2</text>
    <text x="420" y="456">4</text>
    <text x="450" y="456">6</text>
    <text x="480" y="456">8</text>
    <text x="510" y="456">10</text>
  </g>
  <text x="600" y="420" text-anchor="middle" font-size="12" fill="#9ca3af" font-style="italic">position y</text>
</svg>
